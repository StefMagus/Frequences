<title>Fréquences</title>
<style>
:root{
  --bg:#f3f5fa;--surface:#ffffff;--surface2:#e9eef7;--text:#18213a;--muted:#55607a;
  --accent:#1f6f8b;--accent-text:#ffffff;--border:#d3dae8;
  --danger:#b3261e;--danger-bg:#fde8e7;--warn:#7a4f00;--warn-bg:#fff2cc;--star:#d39200;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1525;--surface:#182136;--surface2:#212c45;--text:#eef2fb;--muted:#a9b3ca;
    --accent:#5cc0d6;--accent-text:#04222b;--border:#2d3a58;
    --danger:#ff8f86;--danger-bg:#3b1614;--warn:#ffd36b;--warn-bg:#3a2e0b;--star:#ffd04d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:19px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px}
body.no-nav{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand img{width:32px;height:32px;border-radius:8px}
.lang{min-height:52px;min-width:108px;padding:0 16px;border-radius:26px;border:2px solid var(--accent);background:transparent;font-size:20px;font-weight:600;letter-spacing:.5px}
.lang b{color:var(--accent)}
.lang span{opacity:.55}

main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;line-height:1.2;margin:8px 0 12px}
h2{font-size:21px;margin:26px 0 10px;color:var(--muted)}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 18px;margin:10px 0;
  border-radius:16px;border:2px solid var(--border);background:var(--surface);font-weight:600;font-size:20px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.huge{min-height:84px;font-size:26px;border-radius:22px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.back{width:auto;min-height:48px;padding:6px 14px;margin:0 0 6px;font-size:18px;border:none;background:transparent;color:var(--accent)}
.row{display:flex;gap:10px}
.row > *{flex:1}

.search{width:100%;min-height:56px;padding:12px 16px;border-radius:16px;border:2px solid var(--border);background:var(--surface);font-size:19px}

.card{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin:10px 0;overflow:hidden}
.card-main{flex:1;text-align:left;border:none;background:transparent;padding:14px 16px;min-height:68px}
.card-title{font-weight:650;font-size:20px;display:block}
.card-sub{font-size:16px;color:var(--muted);display:block;margin-top:2px}
.star{width:64px;border:none;border-left:1px solid var(--border);background:transparent;font-size:30px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star)}
.badge{display:inline-block;font-size:14px;padding:1px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:600}

.info{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 16px;margin:12px 0}
.info div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.info div:last-child{border-bottom:none}
.info dt{color:var(--muted)}
.info dd{margin:0;text-align:right;font-weight:600}

.alert{border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:650}
.alert.drive{background:var(--danger-bg);color:var(--danger);border:2px solid var(--danger)}
.alert.high{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)}

label.field{display:block;margin:16px 0 6px;font-weight:600}
.input,textarea.input,select.input{width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:var(--surface)}
textarea.input{min-height:90px;resize:vertical}
.hint{font-size:15px;color:var(--muted);margin-top:4px}
.err{color:var(--danger);font-weight:600;margin:10px 0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;min-width:70px;padding:8px 14px;border-radius:25px;border:2px solid var(--border);background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.vol{display:flex;align-items:center;gap:12px}
.vol output{min-width:56px;text-align:right;font-weight:700}

.run{text-align:center}
.timer{font-size:68px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.stepline{font-size:22px;font-weight:600;margin:4px 0 0}
.pulse-wrap{display:flex;justify-content:center;align-items:center;height:230px}
.pulse{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent),transparent 72%);
  border:3px solid var(--accent);opacity:.85;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.06);opacity:.95}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.intent{font-style:italic;color:var(--muted)}

.big-emoji{font-size:84px;text-align:center;margin:10px 0}
.center{text-align:center}

.hist{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px;margin:10px 0}
.hist-date{font-size:15px;color:var(--muted)}
.hist-name{font-weight:650}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:74px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
nav.bottom a .ico{font-size:26px;line-height:1.1}
nav.bottom a[aria-current="page"]{color:var(--accent)}

footer{max-width:720px;margin:24px auto 0;padding:16px;font-size:14px;color:var(--muted);text-align:center;border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:9;max-width:90vw;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt=""><span id="brand-name">Fréquences</span></div>

</header>
<main id="app"></main>
<footer id="footer"></footer>
<nav class="bottom" id="nav"></nav>

<script>

const mem = {};

    try {
      const v = localStorage.getItem('frq.' + k);
      if (v !== null) return JSON.parse(v);
    } catch (e) { /* stockage bloqué ou donnée illisible */ }
    return (k in mem) ? mem[k] : d;
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem('frq.' + k, JSON.stringify(v)); } catch (e) { /* stockage bloqué */ }
  }
};

const L = (o) => (typeof o === 'string' ? o : (o[lang] || o.fr));
const fmtHz = (f) => f.toLocaleString(lang === 'fr' ? 'fr-CA' : 'en-CA', { maximumFractionDigits: 2 });

/* ===================== DONNÉES UTILISATEUR ===================== */
const getCustom = () => { const c = store.get('custom', []); return Array.isArray(c) ? c : []; };

const allPrograms = () => CATALOG.concat(getCustom());
const findProgram = (id) => allPrograms().find((p) => p.id === id);
function storageWorks() {
  try { localStorage.setItem('frq.__t', '1'); localStorage.removeItem('frq.__t'); return true; } catch (e) { return false; }
}

const CARRIER = 200;          // porteuse binaurale (Hz)
const FADE = 3;               // fondu d'entrée / de sortie (s)
const XFADE = 1.5;            // petit fondu entre les étapes (s)

function modeLabel(p) {
  if (p.mode === 'binaural') return t('modeBinaural');
  if (p.mode === 'suite') return t('modeSuite');
  return p.f.length > 1 ? t('modeEnsemble') : t('modeSingle');
}
function freqLabel(p) {
  if (p.mode === 'binaural') return p.f.map((f) => fmtHz(f) + ' Hz').join(' → ') + ' (binaural)';
  return p.f.map((f) => fmtHz(f) + ' Hz').join(p.mode === 'suite' ? ' → ' : ' + ');
}
function needsDriveWarning(p) {
  const names = (typeof p.name === 'string' ? p.name : p.name.fr + ' ' + p.name.en);
  return (p.mode === 'binaural' && p.f.some((f) => f < 8)) || /sommeil|sleep|m[ée]dit/i.test(names);
}

/* ===================== PLAFOND DE VOLUME (> 5000 Hz) ===================== */
const HIGH_HZ = 5000;
const HIGH_CAP = 0.30;
function isHigh(p) { return p.mode !== 'binaural' && p.f.some((f) => f > HIGH_HZ); }
function volumeCap(p) { return isHigh(p) ? HIGH_CAP : 1; }
function cappedVolume(p, v) { return Math.max(0, Math.min(v, volumeCap(p))); }

/* ===================== AUDIO (Web Audio API) ===================== */
// Chaîne : couche(s) d'oscillateurs -> env (fondus 3 s) -> master (volume) -> haut-parleurs
const Sound = {
  ctx: null, env: null, master: null, layer: null, cap: 1,

  ensure() {                                   // appelé uniquement depuis un toucher (Lancer / C'est fait)
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.env = this.ctx.createGain();
      this.env.gain.value = 0;
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;
      this.env.connect(this.master).connect(this.ctx.destination);
      this.ctx.addEventListener('statechange', onAudioState);
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    return this.ctx;
  },

  ramp(param, to, secs) {
    const now = this.ctx.currentTime;
    param.cancelScheduledValues(now);
    param.setValueAtTime(param.value, now);
    param.linearRampToValueAtTime(to, now + secs);
  },

  setVolume(v) {                               // v : 0..1, toujours plafonné
    if (!this.ctx) return;
    const safe = Math.min(Math.max(v, 0), this.cap);
    this.ramp(this.master.gain, 0.6 * safe * safe, 0.08);
  },

  // Construit une couche sonore pour une étape.
  buildLayer(mode, freqs) {
    const ctx = this.ctx;
    const out = ctx.createGain();
    out.gain.value = 0;
    const oscs = [];
    if (mode === 'binaural') {
      // BINAURAL : porteuse 200 Hz à gauche, 200 + f Hz à droite
      const beat = freqs[0];
      const merger = ctx.createChannelMerger(2);
      const left = ctx.createOscillator();
      const right = ctx.createOscillator();
      left.type = right.type = 'sine';
      left.frequency.value = CARRIER;
      right.frequency.value = CARRIER + beat;
      left.connect(merger, 0, 0);              // canal 0 = oreille gauche
      right.connect(merger, 0, 1);             // canal 1 = oreille droite
      merger.connect(out);
      oscs.push(left, right);
    } else {
      // ENSEMBLE (et « à la suite », une fréquence par étape) :
      // toutes les fréquences de l'étape en même temps, volume divisé par leur nombre
      const share = 1 / freqs.length;
      for (const f of freqs) {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = f;
        const g = ctx.createGain();
        g.gain.value = share;
        osc.connect(g).connect(out);
        oscs.push(osc);
      }
    }
    out.connect(this.env);
    oscs.forEach((o) => o.start());
    return { out, oscs };
  },

  dropLayer(layer, secs) {
    if (!layer) return;
    this.ramp(layer.out.gain, 0, secs);
    const stopAt = this.ctx.currentTime + secs + 0.05;
    layer.oscs.forEach((o) => { try { o.stop(stopAt); } catch (e) {} });
    setTimeout(() => { try { layer.out.disconnect(); } catch (e) {} }, (secs + 0.3) * 1000);
  },

  // Passe à une étape : la nouvelle couche monte pendant que l'ancienne descend (petit fondu).
  setStep(mode, freqs, first) {
    const next = this.buildLayer(mode, freqs);
    if (first) next.out.gain.value = 1;        // le fondu d'entrée de 3 s est fait par env
    else this.ramp(next.out.gain, 1, XFADE);
    this.dropLayer(this.layer, first ? 0.05 : XFADE);
    this.layer = next;
  },

  begin(cap, volume) {
    this.cap = cap;
    this.setVolume(volume);
    this.ramp(this.env.gain, 1, FADE);         // fondu d'entrée 3 s
  },

  end() {
    if (!this.ctx) return;
    this.ramp(this.env.gain, 0, FADE);         // fondu de sortie 3 s
    this.dropLayer(this.layer, FADE);
    this.layer = null;
    const ctx = this.ctx;
    setTimeout(() => { if (!Session.active && ctx.state === 'running') ctx.suspend().catch(() => {}); }, (FADE + 0.5) * 1000);
  }
};

/* ===================== WAKE LOCK (écran allumé pendant la séance) ===================== */
const Wake = {
  sentinel: null,
  async acquire() {
    if (!('wakeLock' in navigator) || this.sentinel || document.visibilityState !== 'visible') return;
    try {
      const s = await navigator.wakeLock.request('screen');
      if (!Session.active) { s.release().catch(() => {}); return; }   // séance arrêtée entre-temps
      this.sentinel = s;
      s.addEventListener('release', () => { if (this.sentinel === s) this.sentinel = null; });
    } catch (e) { this.sentinel = null; }      // refusé (batterie faible, etc.) : on continue sans
  },
  async release() {
    const s = this.sentinel;
    this.sentinel = null;
    if (s) { try { await s.release(); } catch (e) {} }
  }
};

/* ===================== SÉANCE ===================== */
const Session = { active: false };
let lastDone = null;

function startSession(p, cfg) {
  if (!Sound.ensure()) return;
  const steps = p.f.map((f) => [f]);
  const plan = p.mode === 'ensemble'
    ? { steps: [p.f], stepSec: cfg.minutes * 60 }
    : p.mode === 'suite'
      ? { steps, stepSec: cfg.step * 60 }
      : { steps, stepSec: (cfg.minutes * 60) / steps.length };
  Object.assign(Session, {
    active: true, prog: p, mode: p.mode, steps: plan.steps, stepSec: plan.stepSec,
    total: plan.stepSec * plan.steps.length, elapsed: 0, idx: -1,
    last: performance.now(), intention: cfg.intention || ''
  });
  Sound.begin(volumeCap(p), getVolume());
  Wake.acquire();
  if (!p.custom) trackEvent('lancement/' + p.id, p.name.fr);   // nom du programme seulement
  Session.timer = setInterval(tick, 250);
  location.hash = '#run';
  tick();
}

function onAudioState() {
  if (!Session.active) return;
  const now = performance.now();
  if (Sound.ctx.state !== 'running') Session.elapsed += (now - Session.last) / 1000;
  Session.last = now;
  updateRun();
}

function tick() {
  if (!Session.active) return;
  const now = performance.now();
  if (Sound.ctx.state === 'running') Session.elapsed += (now - Session.last) / 1000;  // ne compte que le temps entendu
  Session.last = now;
  if (Session.elapsed >= Session.total) { stopSession(true); return; }
  const i = Math.min(Session.steps.length - 1, Math.floor(Session.elapsed / Session.stepSec));
  if (i !== Session.idx) {
    Sound.setStep(Session.mode, Session.steps[i], Session.idx === -1);
    Session.idx = i;
  }
  updateRun();
}

function stopSession(completed) {
  if (!Session.active) return;
  Session.active = false;
  clearInterval(Session.timer);
  Sound.end();
  Wake.release();
  const p = Session.prog;
  const h = getHistory();
  h.unshift({
    d: Date.now(),
    name: p.custom ? p.name : { fr: p.name.fr, en: p.name.en },
    sec: Math.round(Math.min(Session.elapsed, Session.total)),
    intention: Session.intention
  });
  store.set('history', h.slice(0, 500));
  if (location.hash === '#run') {
    lastDone = completed ? 'done' : 'stopped';
    location.replace('#home');
  }
}

// Retour sur l'écran : reprendre l'audio coupé et redemander le Wake Lock (relâché automatiquement en arrière-plan).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Session.active) {
    Sound.ensure();
    Wake.acquire();
    tick();
  }
});

/* ===================== STATISTIQUES (GoatCounter, opt-in, sans témoins) ===================== */
const GC_SCRIPT = 'https://gc.zgo.at/count.js';
const GC_ENDPOINT = 'https://stef-frequences.goatcounter.com/count';
let gcRequested = false;

function statsChoice() { return store.get('stats', null); }      // null = pas encore répondu = NON
function statsAllowed() { return statsChoice() === 'yes'; }

function loadStats() {
  // Le script n'est inséré QUE si la réponse mémorisée est « Oui », et seulement en ligne.
  if (!statsAllowed() || gcRequested || !navigator.onLine) return;
  gcRequested = true;
  const s = document.createElement('script');
  s.async = true;
  s.src = GC_SCRIPT;
  s.setAttribute('data-goatcounter', GC_ENDPOINT);   // compte l'ouverture de l'app au chargement
  s.onerror = () => { gcRequested = false; s.remove(); };   // hors ligne / bloqué : silence
  document.head.appendChild(s);
}

function trackEvent(path, title) {
  if (!statsAllowed() || !navigator.onLine) return;
  try {
    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
      window.goatcounter.count({ path, title: title || path, event: true });
    }
  } catch (e) { /* aucune erreur visible */ }
}

function setStats(choice) {
  store.set('stats', choice === 'yes' ? 'yes' : 'no');
  if (choice === 'yes') loadStats();
}

window.addEventListener('online', loadStats);

/* ===================== OUTILS D'INTERFACE ===================== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
const go = (hash) => { location.hash = hash; };
const backBtn = (hash) => h('button', { class: 'btn back', type: 'button', onclick: () => go(hash) }, t('back'));
function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
function fmtDur(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m} min${s ? ' ' + s + ' s' : ''}` : `${s} s`;
}
const fmtMin = (m) => `${String(m).replace('.', lang === 'fr' ? ',' : '.')} min`;
function getVolume() { const v = Number(store.get('vol', 0.25)); return isFinite(v) ? Math.min(Math.max(v, 0), 1) : 0.25; }

function volumeControl(p, onChange) {
  const cap = volumeCap(p);
  const value = Math.round(cappedVolume(p, getVolume()) * 100);
  const out = h('output', null, value + ' %');
  const range = h('input', { type: 'range', min: 0, max: Math.round(cap * 100), step: 1, value, 'aria-label': t('volume') });
  range.addEventListener('input', () => {
    const v = cappedVolume(p, Number(range.value) / 100);
    out.textContent = Math.round(v * 100) + ' %';
    store.set('vol', v);
    if (onChange) onChange(v);
  });
  return h('div', null, h('label', { class: 'field' }, t('volume')), h('div', { class: 'vol' }, h('span', { 'aria-hidden': 'true' }, '🔈'), range, out));
}
function warnings(p) {
  return [
    needsDriveWarning(p) ? h('div', { class: 'alert drive', role: 'alert' }, '⚠ ' + t('drive')) : null,
    isHigh(p) ? h('div', { class: 'alert high' }, '⚠ ' + t('high'), h('div', { class: 'small' }, t('highCap'))) : null
  ];
}
function chips(options, current, label, onPick) {
  const wrap = h('div', { class: 'chips', role: 'group', 'aria-label': label });
  options.forEach((o) => wrap.append(h('button', {
    class: 'chip', type: 'button', 'aria-pressed': String(o === current),
    onclick: () => { wrap.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false')); wrapPick(o); }
  }, fmtMin(o))));
  function wrapPick(o) { [...wrap.children][options.indexOf(o)].setAttribute('aria-pressed', 'true'); onPick(o); }
  return wrap;
}

function parseFreqs(s) {
  return String(s).replace(/(\d),(\d)/g, '$1.$2').split(/[^0-9.]+/).filter(Boolean).map(Number).filter((n) => isFinite(n));
}
// Valide (et nettoie) un programme perso — utilisé par le formulaire ET par l'import.
function validateProgram(o) {
  if (!o || typeof o !== 'object') return { err: 'errName' };
  const name = String(o.name || '').trim().slice(0, 60);
  if (!name) return { err: 'errName' };
  const mode = ['ensemble', 'suite', 'binaural'].includes(o.mode) ? o.mode : 'ensemble';
  const f = (Array.isArray(o.f) ? o.f.map(Number) : parseFreqs(o.f)).filter((n) => isFinite(n));
  if (!f.length || f.length > 12) return { err: 'errFreqs' };
  if (mode === 'binaural' ? f.some((x) => x < 0.5 || x > 50) : f.some((x) => x < 1 || x > 20000)) {
    return { err: mode === 'binaural' ? 'errBin' : 'errFreqs' };
  }
  const dur = Number(o.dur), step = Number(o.step);
  if (mode !== 'suite' && !(dur >= 1 && dur <= 120)) return { err: 'errDur' };
  if (mode === 'suite' && !(step >= 0.5 && step <= 30)) return { err: 'errStep' };
  return { prog: {
    id: /^c[a-z0-9]{4,30}$/.test(o.id) ? o.id : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    custom: true, name, mode, f: f.map((x) => Math.round(x * 100) / 100),
    cat: CATS.some((c) => c.id === o.cat) ? o.cat : 'abondance',
    dur: mode === 'suite' ? 10 : Math.round(dur), step: mode === 'suite' ? step : 3,
    desc: String(o.desc || '').trim().slice(0, 300)
  } };
}

function viewEdit(id) {
  const existing = id === 'new' ? null : getCustom().find((p) => p.id === id);
  const p = existing || { name: '', cat: 'abondance', mode: 'ensemble', f: [], dur: 10, step: 3, desc: '' };
  const name = h('input', { class: 'input', id: 'f-name', maxlength: 60, value: p.name });
  const cat = h('select', { class: 'input', id: 'f-cat' }, CATS.map((c) => h('option', { value: c.id, selected: c.id === p.cat }, L(c))));
  const freqs = h('input', { class: 'input', id: 'f-freqs', inputmode: 'decimal', value: p.f.map(fmtHz).join(' + '), placeholder: '396 + 528' });
  const mode = h('select', { class: 'input', id: 'f-mode' },
    [['ensemble', t('modeEnsemble')], ['suite', t('modeSuite')], ['binaural', t('modeBinaural')]]
      .map(([v, l]) => h('option', { value: v, selected: v === p.mode }, l)));
  const dur = h('input', { class: 'input', id: 'f-dur', type: 'number', min: 1, max: 120, inputmode: 'numeric', value: p.dur });
  const step = h('input', { class: 'input', id: 'f-step', type: 'number', min: 0.5, max: 30, step: 0.5, inputmode: 'decimal', value: p.step });
  const durWrap = h('div', null, h('label', { class: 'field', for: 'f-dur' }, t('fDur')), dur);
  const stepWrap = h('div', null, h('label', { class: 'field', for: 'f-step' }, t('fStep')), step);
  const syncMode = () => { durWrap.hidden = mode.value === 'suite'; stepWrap.hidden = mode.value !== 'suite'; };
  mode.addEventListener('change', syncMode); syncMode();
  const desc = h('textarea', { class: 'input', id: 'f-desc', maxlength: 300 }); desc.value = p.desc || '';
  const err = h('div', { class: 'err', role: 'alert' });
  return h('div', null,
    backBtn('#mine'),
    h('h1', null, existing ? t('editProg') : t('newProg')),
    h('label', { class: 'field', for: 'f-name' }, t('fName')), name,
    h('label', { class: 'field', for: 'f-cat' }, t('fCat')), cat,
    h('label', { class: 'field', for: 'f-freqs' }, t('fFreqs')), freqs, h('div', { class: 'hint' }, t('fFreqsHint')),
    h('label', { class: 'field', for: 'f-mode' }, t('fMode')), mode,
    durWrap, stepWrap,
    h('label', { class: 'field', for: 'f-desc' }, t('fDesc')), desc,
    err,
    h('button', { class: 'btn huge primary', type: 'button', onclick: () => {
      const r = validateProgram({ id: existing && existing.id, name: name.value, cat: cat.value, f: freqs.value,
        mode: mode.value, dur: dur.value, step: String(step.value).replace(',', '.'), desc: desc.value });
      if (r.err) { err.textContent = t(r.err); return; }
      const list = getCustom().filter((x) => x.id !== r.prog.id);
      list.push(r.prog);
      store.set('custom', list);
      toast(t('saved')); go('#mine');
    } }, t('save')),
    h('button', { class: 'btn ghost', type: 'button', onclick: () => go('#mine') }, t('cancel')));
}

function viewHistory() {
  const hist = getHistory();
  return h('div', null,
    h('h1', null, t('history')),
    hist.length ? hist.map((e) => h('div', { class: 'hist' },
      h('div', { class: 'hist-date' }, new Date(e.d).toLocaleString(lang === 'fr' ? 'fr-CA' : 'en-CA', { dateStyle: 'medium', timeStyle: 'short' })),
      h('div', { class: 'hist-name' }, L(e.name || '')),
      h('div', { class: 'muted' }, fmtDur(Number(e.sec) || 0)),
      e.intention ? h('div', { class: 'intent' }, '« ' + e.intention + ' »') : null)) : h('p', { class: 'muted' }, t('histEmpty')),
    hist.length ? h('button', { class: 'btn ghost', type: 'button', onclick: () => {
      if (!window.confirm(t('histClearConfirm'))) return;
      store.set('history', []); render();
    } }, t('histClear')) : null);
}

function exportData() {
  const data = { app: 'AAA_frequences', version: 1, exported: new Date().toISOString(),
    lang, custom: getCustom(), favs: getFavs(), history: getHistory() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: 'frequences-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try { d = JSON.parse(String(reader.result)); } catch (e) { toast(t('importBad')); return; }
    if (!d || typeof d !== 'object' || !Array.isArray(d.custom || []) ) { toast(t('importBad')); return; }
    if (!window.confirm(t('importConfirm'))) return;
    const custom = (d.custom || []).map((o) => validateProgram(o).prog).filter(Boolean).slice(0, 200);
    const ids = new Set(allPrograms().map((p) => p.id).concat(custom.map((p) => p.id)));
    const favs = (Array.isArray(d.favs) ? d.favs : []).filter((x) => typeof x === 'string' && ids.has(x));
    const history = (Array.isArray(d.history) ? d.history : []).slice(0, 500).map((e) => ({
      d: Number(e && e.d) || 0,
      name: e && typeof e.name === 'object' && e.name
        ? { fr: String(e.name.fr || '').slice(0, 80), en: String(e.name.en || '').slice(0, 80) }
        : String((e && e.name) || '').slice(0, 80),
      sec: Math.max(0, Math.round(Number(e && e.sec) || 0)),
      intention: String((e && e.intention) || '').slice(0, 200)
    }));
    store.set('custom', custom); store.set('favs', favs); store.set('history', history);
    if (d.lang === 'en' || d.lang === 'fr') { lang = d.lang; store.set('lang', lang); }
    toast(t('importOk')); render();
  };
  reader.readAsText(file);
}

function viewSettings() {
  const choice = statsChoice();
  const file = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
  file.addEventListener('change', () => { if (file.files[0]) importData(file.files[0]); file.value = ''; });
  return h('div', null,
    h('h1', null, t('settings')),
    storageWorks() ? null : h('div', { class: 'alert high' }, t('storageOff')),
    h('h2', null, t('language')),
    h('div', { class: 'row' },
      h('button', { class: 'chip', type: 'button', 'aria-pressed': String(lang === 'fr'), onclick: () => setLang('fr') }, 'Français'),
      h('button', { class: 'chip', type: 'button', 'aria-pressed': String(lang === 'en'), onclick: () => setLang('en') }, 'English')),
    h('h2', null, t('stats')),
    h('p', null, t('statsQ')),
    h('div', { class: 'row' },
      h('button', { class: 'chip', type: 'button', 'aria-pressed': String(choice === 'yes'),
        onclick: () => { setStats('yes'); toast(t('statsOn')); render(); } }, t('yes')),
      h('button', { class: 'chip', type: 'button', 'aria-pressed': String(choice !== 'yes'),
        onclick: () => { setStats('no'); toast(t('statsOff')); render(); } }, t('no'))),
    h('p', { class: 'muted small' }, t('statsExplain')),
    h('h2', null, t('data')),
    h('button', { class: 'btn', type: 'button', onclick: exportData }, t('exportBtn')),
    h('button', { class: 'btn', type: 'button', onclick: () => file.click() }, t('importBtn')), file,
    installButton());
}

/* ===================== NAVIGATION ===================== */
function setLang(l) {
  lang = l === 'en' ? 'en' : 'fr';
  store.set('lang', lang);
  render();
}
document.getElementById('lang-btn').addEventListener('click', () => setLang(lang === 'fr' ? 'en' : 'fr'));

const NAV = [['#home', '🏠', 'home'], ['#mine', '➕', 'mine'], ['#history', '🕘', 'history'], ['#settings', '⚙️', 'settings']];

function render() {
  document.documentElement.lang = lang;
  document.title = t('appName');
  document.getElementById('brand-name').textContent = t('appName');
  const lb = document.getElementById('lang-btn');
  lb.replaceChildren(lang === 'fr' ? h('b', null, 'FR') : h('span', null, 'FR'), ' | ', lang === 'en' ? h('b', null, 'EN') : h('span', null, 'EN'));
  lb.setAttribute('aria-label', lang === 'fr' ? 'Switch to English' : 'Passer en français');
  document.getElementById('footer').textContent = t('footer');

  const [route, arg] = (location.hash || '#home').split('/');
  const id = arg ? decodeURIComponent(arg) : '';
  if (route !== '#run' && Session.active) stopSession(false);   // quitter l'écran de séance = arrêter
  runEls = null; listBox = null;

  let view;
  const asking = statsChoice() === null;
  if (asking) view = viewStatsAsk();
  else if (route === '#p') view = viewProgram(id);
  else if (route === '#ear') view = viewEar(id);
  else if (route === '#run') view = viewRun();
  else if (route === '#mine') view = viewMine();
  else if (route === '#edit') view = viewEdit(id);
  else if (route === '#history') view = viewHistory();
  else if (route === '#settings') view = viewSettings();
  else view = viewHome();

  const hideNav = asking || route === '#run';
  const nav = document.getElementById('nav');
  nav.hidden = hideNav;
  document.body.classList.toggle('no-nav', hideNav);
  const navRoute = route === '#p' || route === '#ear' ? '#home' : route === '#edit' ? '#mine' : route;
  nav.replaceChildren(...NAV.map(([href, ico, key]) => h('a', { href, 'aria-current': navRoute === href ? 'page' : null },
    h('span', { class: 'ico', 'aria-hidden': 'true' }, ico), t(key))));

  document.getElementById('app').replaceChildren(view);
  if (route === '#run') updateRun();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ===================== DÉMARRAGE ===================== */
render();
loadStats();     // ne fait rien tant que la réponse n'est pas « Oui »
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
